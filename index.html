    /**
     * =========================================================================
     * 2. IndexedDB 大容量儲存引擎 (커스텀 다중 슬롯 + 1,200p+ + 이미지 Blob)
     * =========================================================================
     */
    const LocalIDB = {
      dbName: "MedPrepQBank_IDB_v1",
      dbVersion: 1,
      db: null,

      async init() {
        if (this.db) return this.db;
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(this.dbName, this.dbVersion);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains("datasets")) {
              db.createObjectStore("datasets", { keyPath: "key" });
            }
            if (!db.objectStoreNames.contains("images")) {
              db.createObjectStore("images", { keyPath: "id" });
            }
          };
          req.onsuccess = (e) => {
            this.db = e.target.result;
            resolve(this.db);
          };
          req.onerror = (e) => reject(e.target.error);
        });
      },

      async setDataset(key, value) {
        const db = await this.init();
        return new Promise((resolve, reject) => {
          const tx = db.transaction("datasets", "readwrite");
          tx.objectStore("datasets").put({ key, value, updatedAt: Date.now() });
          tx.oncomplete = () => resolve(true);
          tx.onerror = (e) => reject(e.target.error);
        });
      },

      async getDataset(key) {
        const db = await this.init();
        return new Promise((resolve, reject) => {
          const tx = db.transaction("datasets", "readonly");
          const req = tx.objectStore("datasets").get(key);
          req.onsuccess = () => resolve(req.result ? req.result.value : null);
          req.onerror = (e) => reject(e.target.error);
        });
      },

      async deleteDataset(key) {
        const db = await this.init();
        return new Promise((resolve, reject) => {
          const tx = db.transaction("datasets", "readwrite");
          tx.objectStore("datasets").delete(key);
          tx.oncomplete = () => resolve(true);
          tx.onerror = (e) => reject(e.target.error);
        });
      },

      async saveImageBlob(id, blob) {
        const db = await this.init();
        return new Promise((resolve, reject) => {
          const tx = db.transaction("images", "readwrite");
          tx.objectStore("images").put({ id, blob, updatedAt: Date.now() });
          tx.oncomplete = () => resolve(`idb://${id}`);
          tx.onerror = (e) => reject(e.target.error);
        });
      },

      async getImageBlob(imageId) {
        const db = await this.init();
        return new Promise((resolve) => {
          const tx = db.transaction("images", "readonly");
          const req = tx.objectStore("images").get(imageId);
          req.onsuccess = () => resolve(req.result ? req.result.blob : null);
          req.onerror = () => resolve(null);
        });
      },

      async getImageBlobUrl(imageId) {
        const blob = await this.getImageBlob(imageId);
        return blob ? URL.createObjectURL(blob) : null;
      }
    };

    /**
     * =========================================================================
     * 3. 커스텀 모드 다중 슬롯 관리자 (최대 5개 슬롯 생성/전환/이름변경/삭제)
     * =========================================================================
     */
    const CustomSlotManager = {
      META_KEY: "qbank_custom_slots_meta_v1",
      ACTIVE_KEY: "qbank_custom_active_slot_v1",
      MAX_SLOTS: 999, // 5개 제한 해제

      getSlots() {
        try {
          const list = JSON.parse(localStorage.getItem(this.META_KEY) || "[]");
          if (list.length > 0) return list;
        } catch {}
        const initial = [{ id: "slot_1", name: "預設自訂題庫 1", createdAt: Date.now() }];
        localStorage.setItem(this.META_KEY, JSON.stringify(initial));
        localStorage.setItem(this.ACTIVE_KEY, "slot_1");
        return initial;
      },

      saveSlots(slots) {
        localStorage.setItem(this.META_KEY, JSON.stringify(slots));
      },

      getActiveSlotId() {
        const slots = this.getSlots();
        const saved = localStorage.getItem(this.ACTIVE_KEY);
        if (saved && slots.some((s) => s.id === saved)) return saved;
        localStorage.setItem(this.ACTIVE_KEY, slots[0].id);
        return slots[0].id;
      },

      setActiveSlotId(slotId) {
        localStorage.setItem(this.ACTIVE_KEY, slotId);
      },

      createSlot(name) {
        const slots = this.getSlots();
        const id = "slot_" + Date.now();
        const cleanName = (name || "").trim() || `自訂題庫 ${slots.length + 1}`;
        slots.push({ id, name: cleanName, createdAt: Date.now() });
        this.saveSlots(slots);
        this.setActiveSlotId(id);
        return id;
      },

      renameSlot(slotId, newName) {
        const slots = this.getSlots();
        const target = slots.find((s) => s.id === slotId);
        if (target && newName.trim()) {
          target.name = newName.trim();
          this.saveSlots(slots);
        }
      },

      async deleteSlot(slotId) {
        let slots = this.getSlots();
        if (slots.length <= 1) return false;
        slots = slots.filter((s) => s.id !== slotId);
        this.saveSlots(slots);
        await LocalIDB.deleteDataset(`custom_slot_${slotId}`);
        localStorage.removeItem(`qbank_custom_records_${slotId}`);
        localStorage.removeItem(`qbank_custom_pos_${slotId}`);
        this.setActiveSlotId(slots[0].id);
        return true;
      }
    };

    /**
     * =========================================================================
     * 4. 이미지 비동기 하이드레이션 해결기 (idb:// + 일반 경로 + 메모리 미리보기)
     * =========================================================================
     */
    const ImageResolver = {
      cache: new Map(),

      registerTempUrl(key, blobUrl) {
        this.cache.set(key, blobUrl);
      },

      renderImageTagHtml(imageRef, imgId = "") {
        if (!imageRef) return "";
        const idAttr = imgId ? `id="${imgId}"` : "";
        if (imageRef.startsWith("idb://")) {
          const cachedUrl = this.cache.get(imageRef);
          if (cachedUrl) {
            return `<img ${idAttr} src="${cachedUrl}" data-idb-src="${imageRef}" alt="題目附圖" class="max-h-72 rounded-lg object-contain" />`;
          }
          return `<img ${idAttr} src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" data-idb-src="${imageRef}" alt="題目附圖載入中..." class="max-h-72 rounded-lg object-contain min-h-[120px] bg-slate-200/40 dark:bg-slate-800/40 animate-pulse" />`;
        }
        const memUrl = this.cache.get(imageRef);
        const finalSrc = memUrl || imageRef;
        return `<img ${idAttr} src="${finalSrc}" alt="題目附圖" class="max-h-72 rounded-lg object-contain" crossorigin="anonymous" />`;
      },

      async hydrateImages(container = document) {
        const imgs = container.querySelectorAll("img[data-idb-src]");
        for (const img of imgs) {
          const idbRef = img.getAttribute("data-idb-src");
          if (!idbRef) continue;
          let url = this.cache.get(idbRef);
          if (!url) {
            const rawKey = idbRef.slice(6);
            url = await LocalIDB.getImageBlobUrl(rawKey);
            if (url) this.cache.set(idbRef, url);
          }
          if (url) {
            img.src = url;
            img.classList.remove("animate-pulse", "min-h-[120px]");
          }
        }
      }
    };

    /**
     * =========================================================================
     * 5. 사용자 학습 진도·오답(연속 2회 졸업)·북마크·단원별 이어보기 상태 관리자
     * =========================================================================
     */
    const ProgressStore = {
      STORAGE_KEY: "qbank_user_records_v1",
      CHAPTER_POS_KEY: "qbank_chapter_last_pos_v1",
      LOCAL_RANK_KEY: "qbank_local_rankings_v1",
      REPORTS_KEY: "qbank_issue_reports_v1",
      FEEDBACK_KEY: "qbank_user_feedbacks_v1",

      _resolveRecordKey(subject) {
        if (subject === "custom") {
          const slotId = CustomSlotManager.getActiveSlotId();
          return `qbank_custom_records_${slotId}`;
        }
        return this.STORAGE_KEY;
      },

      _resolvePosKey(subject) {
        if (subject === "custom") {
          const slotId = CustomSlotManager.getActiveSlotId();
          return `qbank_custom_pos_${slotId}`;
        }
        return this.CHAPTER_POS_KEY;
      },

      getRecords(subject) {
        const key = this._resolveRecordKey(subject);
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : {};
        } catch {
          return {};
        }
      },

      saveRecords(subject, records) {
        const key = this._resolveRecordKey(subject);
        localStorage.setItem(key, JSON.stringify(records));
      },

      getQuestionState(subject, questionId) {
        const records = this.getRecords(subject);
        return records[questionId] || {
          studyDone: false,
          studyUpdatedAt: 0,
          testStatus: null,
          testUpdatedAt: 0,
          bookmarked: false,
          bookmarkUpdatedAt: 0,
          wrongStreak: 0,
          graduated: false
        };
      },

      markStudyDone(subject, questionId) {
        const records = this.getRecords(subject);
        const cur = this.getQuestionState(subject, questionId);
        if (!cur.studyDone) {
          cur.studyDone = true;
          cur.studyUpdatedAt = Date.now();
          records[questionId] = cur;
          this.saveRecords(subject, records);
        }
      },

      recordTestResult(subject, questionId, isCorrect, isWrongReviewMode = false) {
        const records = this.getRecords(subject);
        const cur = this.getQuestionState(subject, questionId);
        const now = Date.now();

        cur.testStatus = isCorrect ? "correct" : "wrong";
        cur.testUpdatedAt = now;

        if (isCorrect) {
          if (isWrongReviewMode) {
            cur.wrongStreak = (cur.wrongStreak || 0) + 1;
            if (cur.wrongStreak >= 2) cur.graduated = true;
          }
        } else {
          cur.wrongStreak = 0;
          cur.graduated = false;
        }

        records[questionId] = cur;
        this.saveRecords(subject, records);
        return cur;
      },

      toggleBookmark(subject, questionId) {
        const records = this.getRecords(subject);
        const cur = this.getQuestionState(subject, questionId);
        cur.bookmarked = !cur.bookmarked;
        cur.bookmarkUpdatedAt = Date.now();
        records[questionId] = cur;
        this.saveRecords(subject, records);
        return cur.bookmarked;
      },

      getAllChapterPositions(subject) {
        const key = this._resolvePosKey(subject);
        try {
          return JSON.parse(localStorage.getItem(key) || "{}");
        } catch {
          return {};
        }
      },

      getChapterPosition(subject, chapterId, mode) {
        const all = this.getAllChapterPositions(subject);
        const compositeKey = `${subject}_${chapterId}`;
        return all[compositeKey]?.[mode] || null;
      },

      setChapterPosition(subject, chapterId, mode, questionId, num) {
        const key = this._resolvePosKey(subject);
        const all = this.getAllChapterPositions(subject);
        const compositeKey = `${subject}_${chapterId}`;
        if (!all[compositeKey]) all[compositeKey] = {};
        all[compositeKey][mode] = { questionId, num, updatedAt: Date.now() };
        localStorage.setItem(key, JSON.stringify(all));
      },

      clearChapterPosition(subject, chapterId) {
        const key = this._resolvePosKey(subject);
        const all = this.getAllChapterPositions(subject);
        delete all[`${subject}_${chapterId}`];
        localStorage.setItem(key, JSON.stringify(all));
      },

      resetChapterProgress(subject, chapterId, questionIds, mode = "all") {
        const records = this.getRecords(subject);
        const now = Date.now();
        questionIds.forEach((qid) => {
          if (!records[qid]) return;
          if (mode === "study" || mode === "all") {
            records[qid].studyDone = false;
            records[qid].studyUpdatedAt = now;
          }
          if (mode === "test" || mode === "all") {
            records[qid].testStatus = null;
            records[qid].testUpdatedAt = now;
          }
        });
        this.saveRecords(subject, records);
        this.clearChapterPosition(subject, chapterId);
      },

      mergeRemoteRecords(localRecords, remoteRecords) {
        const merged = { ...localRecords };
        const allIds = new Set([...Object.keys(localRecords), ...Object.keys(remoteRecords)]);

        allIds.forEach((qid) => {
          const loc = localRecords[qid];
          const rem = remoteRecords[qid];
          if (!loc) { merged[qid] = { ...rem }; return; }
          if (!rem) { merged[qid] = { ...loc }; return; }

          const studyDone = Boolean(loc.studyDone || rem.studyDone);
          const studyUpdatedAt = Math.max(loc.studyUpdatedAt || 0, rem.studyUpdatedAt || 0);
          const bookmarked = Boolean(loc.bookmarked || rem.bookmarked);
          const bookmarkUpdatedAt = Math.max(loc.bookmarkUpdatedAt || 0, rem.bookmarkUpdatedAt || 0);

          let testStatus = loc.testStatus || null;
          let testUpdatedAt = loc.testUpdatedAt || 0;
          let wrongStreak = loc.wrongStreak || 0;
          let graduated = Boolean(loc.graduated);

          if (!loc.testStatus && rem.testStatus) {
            testStatus = rem.testStatus;
            testUpdatedAt = rem.testUpdatedAt || 0;
            wrongStreak = rem.wrongStreak || 0;
            graduated = Boolean(rem.graduated);
          } else if (loc.testStatus && rem.testStatus && loc.testStatus !== rem.testStatus) {
            if ((rem.testUpdatedAt || 0) > (loc.testUpdatedAt || 0)) {
              testStatus = rem.testStatus;
              testUpdatedAt = rem.testUpdatedAt || 0;
              wrongStreak = rem.wrongStreak || 0;
              graduated = Boolean(rem.graduated);
            }
          } else if (loc.testStatus === rem.testStatus) {
            testUpdatedAt = Math.max(loc.testUpdatedAt || 0, rem.testUpdatedAt || 0);
            wrongStreak = Math.max(loc.wrongStreak || 0, rem.wrongStreak || 0);
            graduated = Boolean(loc.graduated || rem.graduated);
          }

          merged[qid] = {
            studyDone, studyUpdatedAt, testStatus, testUpdatedAt,
            bookmarked, bookmarkUpdatedAt, wrongStreak, graduated
          };
        });
        return merged;
      }
    };
    window.ProgressStore = ProgressStore;

      showToast(message, type = "info") {

        toast.innerHTML = `<span>${message}</span>`;

      async selectSubject(subject) {
        this.state.subject = subject;
        const badge = document.getElementById("subject-badge");
        const homeBtn = document.getElementById("btn-home");
        homeBtn.classList.remove("hidden");

        if (subject === "custom") {
          const slotId = CustomSlotManager.getActiveSlotId();

          badge.textContent = `自訂：${activeSlot.name}`;
          badge.classList.remove("hidden");

          let customData = await LocalIDB.getDataset(`custom_slot_${slotId}`);
          if (!customData) {
            const legacy = slotId === "slot_1" ? await LocalIDB.getDataset("custom_qbank") : null;
            customData = legacy || {
              subject: "custom",
              subjectName: activeSlot.name,
              updatedAt: new Date().toISOString(),
              chapters: [],
              questions: []
            };

          this.state.dataset = customData;
          this.renderDashboard();
          return;
        }

        const label = subject === "biology" ? "生物題庫" : "化學題庫";
        badge.textContent = label;
        badge.classList.remove("hidden");

        const url = `data/${subject}.json?v=${Date.now()}`;
        try {
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) throw new Error("Remote JSON not found");
          const json = await res.json();
          this.state.dataset = json;
          await LocalIDB.setDataset(`cache_${subject}`, json);
          this.showToast(`已載入最新${label}`, "success");
        } catch {
          const cached = await LocalIDB.getDataset(`cache_${subject}`);
          this.state.dataset = cached || EMBEDDED_DEFAULT_DATA[subject];
          if (!cached) {
            this.showToast(`目前使用內建範例${label}（待上傳 GitHub JSON 後將自動同步）`, "info");
          }
        }

        this.renderDashboard();
      },

      renderChapterCardHtml(chapter, allQuestions, records) {
        const chQuestions = allQuestions.filter((q) => q.chapterId === chapter.id);
        const total = chQuestions.length;
        if (total === 0) return "";

        let testAnswered = 0;
        let testCorrect = 0;
        let testWrong = 0;
        let studyDoneCount = 0;

        chQuestions.forEach((q) => {
          const r = records[q.id];
          if (!r) return;
          if (r.studyDone) studyDoneCount++;
          if (r.testStatus === "correct") {
            testAnswered++;
            testCorrect++;
          } else if (r.testStatus === "wrong") {
            testAnswered++;
            testWrong++;
          }
        });

        const studyPct = Math.round((studyDoneCount / total) * 100);
        const testPct = Math.round((testAnswered / total) * 100);
        const accuracyPct = testAnswered > 0 ? Math.round((testCorrect / testAnswered) * 100) : 0;
        const isCompleted = testAnswered === total && total > 0;

        const studyLastPos = ProgressStore.getChapterPosition(this.state.subject, chapter.id, "study");
        const testLastPos = ProgressStore.getChapterPosition(this.state.subject, chapter.id, "test");

        const unansweredStudy = total - studyDoneCount;
        const unansweredTest = total - testAnswered;

        return `
          <div class="bg-white dark:bg-slate-900 border ${isCompleted ? "border-emerald-400 dark:border-emerald-700" : "border-slate-200 dark:border-slate-800"} rounded-2xl p-5 shadow-xs flex flex-col justify-between transition">
            <div>
              <div class="flex items-start justify-between gap-2">
                <div>
                  <div class="flex flex-wrap items-center gap-1.5">
                    <span class="text-xs font-semibold text-blue-600 dark:text-blue-400">共 ${total} 題</span>
                    ${this.state.onlyUnanswered ? `
                      <span class="text-[11px] px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 font-semibold">
                        未學習 ${unansweredStudy} 題 · 未測驗 ${unansweredTest} 題
                      </span>
                    ` : ""}
                  </div>
                  <h4 class="font-bold text-base text-slate-900 dark:text-white mt-0.5">${chapter.title}</h4>
                </div>
                <button onclick="App.confirmResetChapter('${chapter.id}', '${chapter.title}')" class="p-1.5 rounded-lg text-slate-400 hover:text-rose-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition shrink-0" title="重置本章進度">
                  <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                </button>
              </div>

              <!-- 학습 모드 & 테스트 모드 듀얼 진행률 바 + 마지막 본 문제 번호 표시 -->
              <div class="mt-4 space-y-3">
                <div class="space-y-1">
                  <div class="flex items-center justify-between text-xs">
                    <span class="text-slate-600 dark:text-slate-400">學習進度：<strong>${studyDoneCount}/${total}</strong> (${studyPct}%)</span>
                    <span class="text-[11px] font-medium text-emerald-600 dark:text-emerald-400">
                      ${studyLastPos ? `上次看到第 ${studyLastPos.num} 題` : "尚未開始"}
                    </span>
                  </div>
                  <div class="w-full h-1.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                    <div class="h-full bg-emerald-500 transition-all duration-300" style="width: ${studyPct}%"></div>
                  </div>

      autoFillCustomChapterName(inputEl) {
        const file = inputEl?.files?.[0];
        const nameInput = document.getElementById("custom-import-chapter-name");
        if (file && nameInput && !nameInput.value.trim()) {
          nameInput.value = file.name.replace(/\.(pdf|json)$/i, "");
        }
      },

      async handleCustomFileUpload() {
        const fileInput = document.getElementById("custom-import-file");
        const file = fileInput?.files?.[0];
        if (!file) {
          this.showToast("請先選擇 PDF 或 JSON 檔案", "warning");
          return;
        }
        const slotId = CustomSlotManager.getActiveSlotId();
        const slots = CustomSlotManager.getSlots();
        const slotName = slots.find((s) => s.id === slotId)?.name || "自訂題庫";

        if (file.name.toLowerCase().endsWith(".json")) {
          try {
            const text = await file.text();
            const parsed = JSON.parse(text);
            if (!Array.isArray(parsed.questions) || !Array.isArray(parsed.chapters)) throw new Error("格式不符");
            parsed.subject = "custom";
            parsed.subjectName = slotName;
            await LocalIDB.setDataset(`custom_slot_${slotId}`, parsed);
            this.state.dataset = parsed;
            this.closeModal();
            this.showToast(`成功匯入 ${parsed.questions.length} 題！`, "success");
            this.renderDashboard();
          } catch {
            this.showToast("JSON 格式解析失敗", "error");
          }
          return;
        }

        if (file.name.toLowerCase().endsWith(".pdf")) {
          if (!window.PdfChunkParser) {
            this.showToast("PDF 解析模組尚未載入，請確認 admin-editor.js 是否在同一資料夾", "error");
            return;
          }
          const mode = document.querySelector('input[name="custom-pdf-mode"]:checked')?.value || "biology";
          const rawChapterTitle = (document.getElementById("custom-import-chapter-name")?.value || "").trim();
          const chapterTitle = rawChapterTitle || file.name.replace(/\.pdf$/i, "");

          const progBox = document.getElementById("custom-pdf-progress-box");
          const progText = document.getElementById("custom-pdf-progress-text");
          const progPct = document.getElementById("custom-pdf-progress-pct");
          const progBar = document.getElementById("custom-pdf-progress-bar");
          const execBtn = document.getElementById("btn-custom-import-exec");

          progBox.classList.remove("hidden");
          execBtn.disabled = true;

          try {
            const existingData = this.state.dataset || {
              subject: "custom",
              subjectName: slotName,
              updatedAt: new Date().toISOString(),
              chapters: [],
              questions: []
            };

            const nextOrder = existingData.chapters.length + 1;
            const newChapterId = "ch" + String(Date.now()).slice(-6);

            // 1개 PDF = 1개 지정 챕터(forcedChapterId)로 강제 매핑하여 챕터 꼬임 방지
            const result = await window.PdfChunkParser.parsePdfFile(file, mode, {
              forcedChapterId: newChapterId,
              startSeq: 0,
              onProgress: (cur, total, qCount) => {
                const pct = Math.round((cur / total) * 100);
                progText.textContent = `正在解析「${chapterTitle}」第 ${cur} / ${total} 頁（已擷取 ${qCount} 題）...`;
                progPct.textContent = `${pct}%`;
                progBar.style.width = `${pct}%`;
              }
            });

            if (result.questions.length === 0) {
              execBtn.disabled = false;
              this.showToast("此 PDF 未擷取到任何題目，請確認檔案內容", "warning");
              return;
            }

            existingData.chapters.push({
              id: newChapterId,
              title: chapterTitle,
              order: nextOrder
            });
            existingData.questions.push(...result.questions);
            existingData.updatedAt = new Date().toISOString();

            await LocalIDB.setDataset(`custom_slot_${slotId}`, existingData);
            this.state.dataset = existingData;
            this.closeModal();
            this.showToast(`「${chapterTitle}」匯入完成！新增 ${result.questions.length} 題（累計 ${existingData.questions.length} 題）`, "success");
            this.renderDashboard();
          } catch (err) {
            execBtn.disabled = false;
            this.showToast("PDF 解析發生錯誤：" + (err.message || "未知錯誤"), "error");
          }
        }
      },

      executeResetChapter(chapterId) {

        ProgressStore.resetChapterProgress(this.state.subject, chapterId, qids, "all");

      prepareChapterLaunch(chapterId, mode, onlyWrong = false) {
        const records = ProgressStore.getRecords(this.state.subject);
        let list = this.state.dataset.questions.filter((q) => q.chapterId === chapterId);

        if (onlyWrong) {
          list = list.filter((q) => records[q.id]?.testStatus === "wrong");
          if (list.length === 0) {
            this.showToast("此範圍內目前沒有待重練的錯題", "info");
            return;
          }
          this.launchPlayer(list, mode, 0, chapterId);
          return;
        }

        if (this.state.onlyUnanswered) {
          list = list.filter((q) => (mode === "study" ? !records[q.id]?.studyDone : !records[q.id]?.testStatus));
          if (list.length === 0) {
            this.showToast("本章節所有題目皆已完成作答！", "info");
            return;
          }
          this.launchPlayer(list, mode, 0, chapterId);
          return;
        }

        const savedPos = ProgressStore.getChapterPosition(this.state.subject, chapterId, mode);
        if (savedPos && savedPos.num > 1) {
          const foundIdx = list.findIndex((q) => q.id === savedPos.questionId);
          const resumeIdx = foundIdx >= 0 ? foundIdx : Math.min(savedPos.num - 1, list.length - 1);

          if (resumeIdx > 0) {
            const modeName = mode === "study" ? "學習模式" : "測驗模式";
            this.openModal(`
              <div class="space-y-4">
                <div class="flex items-center justify-between">
                  <h3 class="text-base font-bold flex items-center gap-2">
                    <i data-lucide="history" class="w-5 h-5 text-blue-600"></i> 繼續上次進度（${modeName}）
                  </h3>
                  <button onclick="App.closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <p class="text-sm text-slate-600 dark:text-slate-300">
                  系統記錄您上次在${modeName}進行到 <strong>第 ${resumeIdx + 1} 題</strong>（共 ${list.length} 題）。請問要從哪裡開始？
                </p>
                <div class="grid grid-cols-2 gap-2.5 pt-1">
                  <button onclick="App.closeModal(); App.executeChapterLaunch('${chapterId}', '${mode}', 0);" class="py-2.5 px-4 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700">
                    從第 1 題重新開始
                  </button>
                  <button onclick="App.closeModal(); App.executeChapterLaunch('${chapterId}', '${mode}', ${resumeIdx});" class="py-2.5 px-4 rounded-xl text-xs font-bold bg-blue-600 hover:bg-blue-500 text-white">
                    繼續第 ${resumeIdx + 1} 題
                  </button>
                </div>
              </div>
            `);
            return;
          }
        }

        this.launchPlayer(list, mode, 0, chapterId);
      },

      executeChapterLaunch(chapterId, mode, startIndex) {
        const list = this.state.dataset.questions.filter((q) => q.chapterId === chapterId);
        this.launchPlayer(list, mode, startIndex, chapterId);
      },

      startWrongReview() {
        const records = ProgressStore.getRecords(this.state.subject);
        const list = this.state.dataset.questions.filter((q) => records[q.id]?.testStatus === "wrong" && !records[q.id]?.graduated);
        if (list.length === 0) {
          this.showToast("目前沒有待複習的錯題！", "info");
          return;
        }
        this.launchPlayer(list, "wrongReview", 0, null);

      startBookmarkReview() {
        const records = ProgressStore.getRecords(this.state.subject);
        const list = this.state.dataset.questions.filter((q) => records[q.id]?.bookmarked);
        if (list.length === 0) {
          this.showToast("目前尚未收藏任何書籤題目", "info");
          return;
        }
        this.launchPlayer(list, "bookmarkReview", 0, null);
      },

      launchPlayer(playlist, mode, startIndex = 0, activeChapterId = null) {
        this.state.view = "player";
        this.state.playlist = playlist;
        this.state.playerMode = mode;
        this.state.activeChapterId = activeChapterId;
        this.state.currentIndex = startIndex;
        this.state.selectedOptionIdx = null;
        this.state.showStudyAnswer = false;
        this.state.playerAnswers = {};
        this.state.maxVisitedIndex = startIndex;

        if (!localStorage.getItem("qbank_swipe_guide_seen")) {
          const overlay = document.getElementById("swipe-onboarding-overlay");
          overlay.classList.remove("hidden");
          overlay.classList.add("flex");
        }

        this.renderPlayer();
      },

      isTestQuestionLocked(index = this.state.currentIndex) {
        if (this.state.playerMode !== "test") return false;
        const userAnswer = this.state.playerAnswers[index];
        const hasAnswered = userAnswer !== null && userAnswer !== undefined;
        return hasAnswered || index < this.state.maxVisitedIndex;
      },

      dismissSwipeGuide() {
        localStorage.setItem("qbank_swipe_guide_seen", "true");
        const overlay = document.getElementById("swipe-onboarding-overlay");
        overlay.classList.add("hidden");
        overlay.classList.remove("flex");
      },

      renderPlayer() {
        const { subject, dataset, playlist, currentIndex, playerMode, activeChapterId, selectedOptionIdx, showStudyAnswer, playerAnswers } = this.state;
        const q = playlist[currentIndex];
        if (!q) return;

        if (playerMode === "study") {
          ProgressStore.markStudyDone(subject, q.id);
        }

        if (activeChapterId && (playerMode === "study" || playerMode === "test")) {
          const allChQs = dataset.questions.filter((item) => item.chapterId === activeChapterId);
          const posInChapter = allChQs.findIndex((item) => item.id === q.id);
          if (posInChapter >= 0) {
            ProgressStore.setChapterPosition(subject, activeChapterId, playerMode, q.id, posInChapter + 1);
          }
        }

        const chapterObj = dataset.chapters.find((c) => c.id === q.chapterId);
        const chapterTitle = chapterObj ? chapterObj.title : q.chapterId;
        const qRecord = ProgressStore.getQuestionState(subject, q.id);

        const modeLabels = {
          study: { text: "學習模式", badge: "bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300" },
          test: { text: "測驗模式", badge: "bg-blue-100 text-blue-700 dark:bg-blue-950 dark:text-blue-300" },
          wrongReview: { text: `錯題重練 (${qRecord.wrongStreak || 0}/2 畢業)`, badge: "bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300" },
          bookmarkReview: { text: "書籤複習", badge: "bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300" }
        };

        const letters = ["A", "B", "C", "D", "E"];
        const isTestMode = playerMode === "test";
        const isLocked = this.isTestQuestionLocked(currentIndex);
        const userAnswer = isTestMode ? (playerAnswers[currentIndex] ?? null) : selectedOptionIdx;
        const isSkippedLocked = isTestMode && isLocked && userAnswer === null;
        const isAnswered = playerMode === "study"
          ? showStudyAnswer
          : (isTestMode ? isLocked : selectedOptionIdx !== null);

        const root = document.getElementById("app-root");
        root.innerHTML = `
          <div class="max-w-3xl mx-auto space-y-4">
            <div class="flex items-center justify-between gap-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl px-4 py-2.5">
              <button onclick="App.renderDashboard()" class="text-xs font-semibold text-slate-600 dark:text-slate-300 hover:text-blue-600 flex items-center gap-1">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> 返回章節
              </button>

              <div class="flex items-center gap-2">
                <span class="text-xs font-bold px-2.5 py-0.5 rounded-full ${modeLabels[playerMode].badge}">${modeLabels[playerMode].text}</span>
                <span class="text-xs font-bold text-slate-700 dark:text-slate-200">${currentIndex + 1} / ${playlist.length}</span>
              </div>

              <div class="flex items-center gap-1">
                <button onclick="App.openOmrModal()" class="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300" title="答題卡 (OMR)">

      revealStudyAnswer() {
        this.state.showStudyAnswer = true;
        this.renderPlayer();
      },

      handleOptionClick(optIdx) {
        const { playerMode, selectedOptionIdx, playlist, currentIndex, subject } = this.state;
        const q = playlist[currentIndex];

        if (playerMode === "study") {
          this.revealStudyAnswer();
          return;
        }
        if (playerMode === "test") {
          if (this.isTestQuestionLocked(currentIndex)) return;
          this.state.playerAnswers[currentIndex] = optIdx;
        } else if (selectedOptionIdx !== null) {
          return;
        }

        this.state.selectedOptionIdx = optIdx;
        const isCorrect = optIdx === q.answerIndex;
        const updated = ProgressStore.recordTestResult(subject, q.id, isCorrect, playerMode === "wrongReview");
        this.renderPlayer();

        if (isCorrect) {
          if (playerMode === "wrongReview" && updated.graduated) {
            this.showToast("連續答對 2 次！此題已從錯題本畢業 🎉", "success");
          }
          setTimeout(() => {
            if (this.state.view === "player" && this.state.currentIndex === currentIndex && this.state.currentIndex < playlist.length - 1) {
              this.nextQuestion();
            }
          }, 600);
        }
      },

      prevQuestion() {
        if (this.state.currentIndex > 0) {
          this.state.currentIndex--;
          this.state.selectedOptionIdx = this.state.playerMode === "test"
            ? (this.state.playerAnswers[this.state.currentIndex] ?? null)
            : null;
          this.state.showStudyAnswer = false;
          this.renderPlayer();
        }
      },

      nextQuestion() {
        if (this.state.currentIndex < this.state.playlist.length - 1) {
          const nextIdx = this.state.currentIndex + 1;
          this.state.currentIndex = nextIdx;
          if (this.state.playerMode === "test") {
            this.state.maxVisitedIndex = Math.max(this.state.maxVisitedIndex, nextIdx);
            this.state.selectedOptionIdx = this.state.playerAnswers[nextIdx] ?? null;
          } else {
            this.state.selectedOptionIdx = null;
          }
          this.state.showStudyAnswer = false;
          this.renderPlayer();
        } else {
          this.showToast("已經是最後一題囉！", "info");
        }
      },

      handleToggleBookmark(questionId) {
        const added = ProgressStore.toggleBookmark(this.state.subject, questionId);
        this.showToast(added ? "已加入我的最愛書籤" : "已移除書籤", "info");
        this.renderPlayer();
      },

      attachSwipeHandlers() {
        const card = document.getElementById("question-swipe-card");
        if (!card) return;
        let startX = 0, startY = 0, deltaX = 0, isHorizontal = null;

        card.addEventListener("touchstart", (e) => {
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          deltaX = 0;
          isHorizontal = null;
          card.style.transition = "none";
        }, { passive: true });

        card.addEventListener("touchmove", (e) => {
          const diffX = e.touches[0].clientX - startX;
          const diffY = e.touches[0].clientY - startY;
          if (isHorizontal === null) isHorizontal = Math.abs(diffX) > Math.abs(diffY);
          if (!isHorizontal) return;
          deltaX = diffX * 0.45;
          card.style.transform = `translateX(${deltaX}px) rotate(${deltaX * 0.03}deg)`;
        }, { passive: true });

        card.addEventListener("touchend", () => {
          card.style.transition = "transform 0.22s ease-out";
          card.style.transform = "translateX(0px) rotate(0deg)";
          if (isHorizontal && Math.abs(deltaX) > 38) {
            deltaX < 0 ? this.nextQuestion() : this.prevQuestion();
          }
        });
      },

      stripHtml(html) {
        const tmp = document.createElement("div");
        tmp.innerHTML = String(html || "")
          .replace(/<sub>(.*?)<\/sub>/gi, "_$1")
          .replace(/<sup>(.*?)<\/sup>/gi, "^$1");
        return tmp.textContent || tmp.innerText || "";
      },

      async copyAiPrompt(lang = "zh") {
        const { dataset, playlist, currentIndex, selectedOptionIdx } = this.state;
        const q = playlist[currentIndex];
        const ch = dataset.chapters.find((c) => c.id === q.chapterId);
        const letters = ["A", "B", "C", "D", "E"];

        const qText = this.stripHtml(q.questionHtml);
        const optionsText = q.options.map((o, idx) => `(${letters[idx]}) ${this.stripHtml(o.textHtml)}`).join("\n");
        const correctText = `(${letters[q.answerIndex]}) ${this.stripHtml(q.options[q.answerIndex].textHtml)}`;
        const myChoiceText = selectedOptionIdx !== null
          ? `(${letters[selectedOptionIdx]}) ${this.stripHtml(q.options[selectedOptionIdx].textHtml)}`
          : (lang === "zh" ? "尚未作答（直接查看解析）" : "미선택 (정답 바로 확인)");

        let prompt = "";
        if (lang === "zh") {
          const imgNotice = q.image ? "*請一併貼上題目附圖*\n\n" : "";
          prompt = `${imgNotice}請幫我詳細解析這道題目：\n【章節】${ch ? ch.title : q.chapterId}\n【題目】${qText}\n【選項】\n${optionsText}\n【我選的答案】${myChoiceText}\n【正確答案】${correctText}\n\n請依序為我說明：\n1. 正確答案的核心觀念與解題推導原理\n2. 其餘各個錯誤選項分別錯在哪裡\n3. 我選的錯誤選項（或本題）最容易讓人掉入的陷阱重點`;
        } else {
          const imgNotice = q.image ? "*그림을 함께 붙여넣어 주세요*\n\n" : "";
          prompt = `${imgNotice}다음 전공 문제를 알기 쉽게 상세히 해설해 주세요:\n[단원명] ${ch ? ch.title : q.chapterId}\n[문제] ${qText}\n[보기]\n${optionsText}\n[내가 고른 답] ${myChoiceText}\n[정답] ${correctText}\n\n다음 3가지를 중심으로 구체적으로 설명해 주세요:\n1. 정답이 도출되는 핵심 원리와 풀이 과정\n2. 나머지 각 보기가 틀린 구체적인 이유\n3. 내가 고른 오답(또는 이 문제)에서 헷갈리기 쉬운 함정 포인트`;
        }

        try {
          await navigator.clipboard.writeText(prompt);
          this.showToast(lang === "zh" ? "已複製繁體中文 AI 解析提問！" : "한국어 AI 질문 프롬프트가 복사되었습니다!", "success");
        } catch {
          this.showToast("複製失敗，請檢查瀏覽器剪貼簿權限", "error");
        }
      },

      async copyQuestionImageToClipboard() {
        const imgEl = document.getElementById("current-question-img");
        if (!imgEl) return;
        try {
          const res = await fetch(imgEl.src);
          const blob = await res.blob();
          await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
          this.showToast("已將題目圖片複製到剪貼簿！", "success");
        } catch {
          this.showToast("圖片複製受瀏覽器安全限制，請長按圖片直接複製", "warning");
        }
      },

              <input id="free-exam-count" type="number" min="1" max="${maxQ}" value="${Math.min(10, maxQ)}" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm font-bold" />
            </div>
            <div class="flex justify-end gap-2 pt-2">
              <button onclick="App.closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800">取消</button>
              <button onclick="App.startFreeExam()" class="px-5 py-2 rounded-xl text-xs font-bold bg-blue-600 hover:bg-blue-500 text-white">開始自由練習</button>
            </div>
          </div>
        `);
      },

      buildShuffledExamQuestions(rawQuestions) {
        const shuffledQs = [...rawQuestions].sort(() => Math.random() - 0.5);
        return shuffledQs.map((q) => {
          const indexedOpts = q.options.map((opt, idx) => ({
            ...opt,
            isCorrect: idx === q.answerIndex
          }));
          const shuffledOpts = indexedOpts.sort(() => Math.random() - 0.5);
          const newAnswerIndex = shuffledOpts.findIndex((o) => o.isCorrect);
          return { ...q, shuffledOptions: shuffledOpts, shuffledAnswerIndex: newAnswerIndex };
        });
      },

      startOfficialExamA() {
        const { dataset } = this.state;
        const cfg = dataset.officialExamConfig || { questionCount: 5, durationMinutes: 10 };
        const count = Math.min(cfg.questionCount, dataset.questions.length);
        const prepared = this.buildShuffledExamQuestions(dataset.questions).slice(0, count);

        this.launchExam({
          examType: "officialA",
          examSetId: "officialA",
          examTitle: "隨機模擬考（常態全範圍）",
          questions: prepared,
          durationMinutes: cfg.durationMinutes
        });
      },

      startOfficialExamB(setId) {
        this.closeModal();
        const { dataset } = this.state;
        const examSet = (dataset.officialExamSets || []).find((s) => s.setId === setId);
        if (!examSet) return;

        const targetQs = examSet.questionIds
          .map((qid) => dataset.questions.find((q) => q.id === qid))
          .filter(Boolean);

        const prepared = this.buildShuffledExamQuestions(targetQs);
        this.launchExam({
          examType: "officialB",
          examSetId: examSet.setId,
          examTitle: examSet.title,
          questions: prepared,
          durationMinutes: examSet.durationMinutes
        });
      },

      startFreeExam() {
        const checkedBoxes = Array.from(document.querySelectorAll('input[name="free-exam-ch"]:checked'));
        const selectedChIds = checkedBoxes.map((cb) => cb.value);
        if (selectedChIds.length === 0) {
          this.showToast("請至少勾選一個章節", "warning");
          return;
        }
        const countInput = parseInt(document.getElementById("free-exam-count").value, 10) || 10;
        const pool = this.state.dataset.questions.filter((q) => selectedChIds.includes(q.chapterId));
        if (pool.length === 0) {
          this.showToast("所選章節內沒有題目", "warning");
          return;
        }

        this.closeModal();
        const prepared = this.buildShuffledExamQuestions(pool).slice(0, Math.min(countInput, pool.length));
        this.launchExam({
          examType: "free",
          examSetId: null,
          examTitle: "自由模擬考（個人不限時練習）",
          questions: prepared,
          durationMinutes: 0
        });
      },

      launchExam({ examType, examSetId, examTitle, questions, durationMinutes }) {
        if (this.state.examTimerInterval) clearInterval(this.state.examTimerInterval);

        this.state.view = "mockExam";
        this.state.examType = examType;
        this.state.examSetId = examSetId;
        this.state.examTitle = examTitle;
        this.state.examQuestions = questions;
        this.state.examAnswers = {};
        this.state.examCurrentIdx = 0;
        this.state.examElapsedSeconds = 0;
        this.state.examTimerSeconds = durationMinutes > 0 ? durationMinutes * 60 : 0;

        if (durationMinutes > 0) {
          this.state.examTimerInterval = setInterval(() => {
            this.state.examTimerSeconds--;
            this.state.examElapsedSeconds++;
            const timerEl = document.getElementById("exam-timer-display");
            if (timerEl) timerEl.textContent = this.formatSeconds(this.state.examTimerSeconds);

            if (this.state.examTimerSeconds <= 0) {
              clearInterval(this.state.examTimerInterval);
              this.showToast("考試時間到！系統已自動交卷", "warning");
              this.gradeExam();
            }
          }, 1000);
        }

        this.renderMockExam();
      },

      formatSeconds(sec) {
        const m = Math.floor(Math.max(0, sec) / 60);
        const s = Math.max(0, sec) % 60;
        return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
      },

      renderMockExam() {
        const { examTitle, examQuestions, examAnswers, examCurrentIdx, examType, examTimerSeconds } = this.state;
        const q = examQuestions[examCurrentIdx];
        const letters = ["A", "B", "C", "D", "E"];
        const answeredCount = Object.keys(examAnswers).length;

        const root = document.getElementById("app-root");
        root.innerHTML = `
          <div class="max-w-3xl mx-auto space-y-4">
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl px-4 py-3 flex items-center justify-between gap-2">
              <div>
                <div class="text-xs font-bold text-indigo-600 dark:text-indigo-400">${examTitle}</div>
                <div class="text-xs text-slate-500 mt-0.5">作答進度：${answeredCount} / ${examQuestions.length} 題</div>
              </div>
              <div class="flex items-center gap-3">
                ${examType !== "free" ? `
                  <div class="px-3 py-1.5 rounded-xl bg-rose-50 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 font-mono font-bold text-sm flex items-center gap-1.5">
                    <i data-lucide="clock" class="w-4 h-4"></i>
                    <span id="exam-timer-display">${this.formatSeconds(examTimerSeconds)}</span>
                  </div>
                ` : `<span class="text-xs px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-500">不限時練習</span>`}
                <button onclick="App.confirmSubmitExam()" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-xs">交卷計分</button>
              </div>
            </div>

            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 sm:p-7 space-y-5">
              <div class="flex items-center justify-between text-xs text-slate-400">
                <span class="font-bold text-slate-700 dark:text-slate-200">第 ${examCurrentIdx + 1} 題（共 ${examQuestions.length} 題）</span>
                <span>選項已隨機排列</span>
              </div>
              <div class="question-html text-base sm:text-lg font-medium leading-relaxed">${q.questionHtml}</div>
              ${q.image ? `
                <div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 p-3 flex justify-center">
                  ${ImageResolver.renderImageTagHtml(q.image)}
                </div>
              ` : ""}
              <div class="space-y-2.5">
                ${q.shuffledOptions.map((opt, idx) => {
                  const isSelected = examAnswers[examCurrentIdx] === idx;
                  return `
                    <button onclick="App.selectExamOption(${idx})" class="w-full text-left p-3.5 rounded-xl border-2 transition flex items-start gap-3 ${isSelected ? "border-indigo-600 bg-indigo-50 dark:bg-indigo-950/50" : "border-slate-200 dark:border-slate-800 hover:border-indigo-400"}">
                      <span class="w-7 h-7 rounded-lg font-bold text-xs flex items-center justify-center shrink-0 mt-0.5 ${isSelected ? "bg-indigo-600 text-white" : "bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300"}">${letters[idx]}</span>
                      <span class="chem-text text-sm sm:text-base pt-0.5">${opt.textHtml}</span>
                    </button>
                  `;
                }).join("")}
              </div>
            </div>

            <div class="flex items-center justify-between gap-2">
              <button onclick="App.navExamQuestion(-1)" ${examCurrentIdx === 0 ? "disabled" : ""} class="px-4 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 disabled:opacity-40 text-xs font-bold">上一題</button>
              <div class="flex flex-wrap justify-center gap-1.5">
                ${examQuestions.map((_, i) => {
                  const answered = examAnswers[i] !== undefined;
                  const active = i === examCurrentIdx;
                  return `<button onclick="App.jumpExamQuestion(${i})" class="w-7 h-7 rounded-lg text-xs font-bold ${active ? "bg-indigo-600 text-white" : answered ? "bg-indigo-100 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300" : "bg-slate-100 dark:bg-slate-800 text-slate-500"}">${i + 1}</button>`;
                }).join("")}
              </div>
              <button onclick="App.navExamQuestion(1)" ${examCurrentIdx === examQuestions.length - 1 ? "disabled" : ""} class="px-4 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 disabled:opacity-40 text-xs font-bold">下一題</button>
            </div>
          </div>
        `;
        lucide.createIcons();
        ImageResolver.hydrateImages(root);
      },

      selectExamOption(optIdx) {
        this.state.examAnswers[this.state.examCurrentIdx] = optIdx;
        this.renderMockExam();
      },

      navExamQuestion(delta) {
        const next = this.state.examCurrentIdx + delta;
        if (next >= 0 && next < this.state.examQuestions.length) {
          this.state.examCurrentIdx = next;
          this.renderMockExam();
        }
      },

      jumpExamQuestion(idx) {
        this.state.examCurrentIdx = idx;
        this.renderMockExam();
      },

      confirmSubmitExam() {
        const total = this.state.examQuestions.length;
        const answered = Object.keys(this.state.examAnswers).length;
        const unanswered = total - answered;

        if (unanswered > 0) {
          this.openModal(`
            <div class="space-y-4">
              <h3 class="text-lg font-bold text-amber-600 flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-5 h-5"></i> 尚有未作答題目
              </h3>
              <p class="text-sm text-slate-600 dark:text-slate-300">您還有 <strong>${unanswered} 題</strong>尚未作答，確定要現在交卷計分嗎？</p>
              <div class="flex justify-end gap-2">
                <button onclick="App.closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800">繼續作答</button>
                <button onclick="App.closeModal(); App.gradeExam();" class="px-4 py-2 rounded-xl text-xs font-bold bg-emerald-600 text-white">確定交卷</button>
              </div>
            </div>
          `);
        } else {
          this.gradeExam();
        }
      },

      gradeExam() {
        if (this.state.examTimerInterval) {
          clearInterval(this.state.examTimerInterval);
          this.state.examTimerInterval = null;
        }

        const { examQuestions, examAnswers, examType, examSetId, examTitle, examElapsedSeconds, subject } = this.state;
        let correctCount = 0;
        const wrongIds = [];

        examQuestions.forEach((q, idx) => {
          const userAns = examAnswers[idx];
          if (userAns === q.shuffledAnswerIndex) {
            correctCount++;
          } else {
            wrongIds.push(q.id);
          }
        });

        const score = Math.round((correctCount / examQuestions.length) * 100);
        this.state.lastExamResult = {
          subject, examType, examSetId, examTitle, score, correctCount,
          totalCount: examQuestions.length, elapsedSeconds: examElapsedSeconds,
          wrongIds, date: new Date().toISOString()
        };

        this.renderMockResult();
      },

        const letters = ["A", "B", "C", "D", "E"];

        const root = document.getElementById("app-root");

              <div>
                <div class="text-5xl font-extrabold text-slate-900 dark:text-white">${res.score} <span class="text-lg font-medium text-slate-400">分</span></div>
                <p class="text-xs text-slate-500 mt-1.5">答對 ${res.correctCount} / ${res.totalCount} 題 ${res.examType !== "free" ? `· 耗時 ${this.formatSeconds(res.elapsedSeconds)}` : ""}</p>
              </div>

              ${res.wrongIds.length > 0 ? `
                <div>
                  <button onclick="App.addExamWrongsToNotebook()" class="px-4 py-2 rounded-xl text-xs font-bold bg-rose-600 hover:bg-rose-500 text-white inline-flex items-center gap-1.5">

                  </button>
                </div>
              ` : ""}

              ${res.examType !== "free" ? `
                <div id="ranking-submit-box" class="mt-4 pt-4 border-t border-slate-200 dark:border-slate-800 max-w-md mx-auto space-y-3 text-left">
                  <div class="text-xs font-bold text-slate-700 dark:text-slate-200">登錄至雲端即時排行榜（每回次僅採計首次成績）：</div>

                  </div>

              ` : ""}
            </div>

            <div class="space-y-3">
              <h4 class="font-bold text-sm">逐題作答檢視</h4>
              ${this.state.examQuestions.map((q, idx) => {
                const userAns = this.state.examAnswers[idx];
                const isRight = userAns === q.shuffledAnswerIndex;
                return `
                  <div class="bg-white dark:bg-slate-900 border ${isRight ? "border-emerald-200 dark:border-emerald-900" : "border-rose-200 dark:border-rose-900"} rounded-2xl p-4 space-y-2">
                    <div class="flex items-center justify-between text-xs">
                      <span class="font-bold ${isRight ? "text-emerald-600" : "text-rose-600"}">第 ${idx + 1} 題 · ${isRight ? "答對" : "答錯"}</span>
                      <span class="text-slate-400">你的答案：${userAns !== undefined ? letters[userAns] : "未作答"} ｜ 正解：${letters[q.shuffledAnswerIndex]}</span>

                    <div class="question-html text-sm">${q.questionHtml}</div>
                    ${q.explanationHtml ? `<div class="chem-text text-xs text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-800/60 p-2.5 rounded-xl">解析：${q.explanationHtml}</div>` : ""}
                  </div>
                `;
              }).join("")}
            </div>

            <div class="flex justify-center pb-6">
              <button onclick="App.renderDashboard()" class="px-6 py-2.5 rounded-xl bg-slate-900 dark:bg-slate-800 text-white font-bold text-xs">返回題庫首頁</button>

      addExamWrongsToNotebook() {
        const res = this.state.lastExamResult;
        if (!res) return;
        res.wrongIds.forEach((qid) => ProgressStore.recordTestResult(res.subject, qid, false, false));
        this.showToast(`已將 ${res.wrongIds.length} 題加入錯題本！`, "success");
      },

      async submitExamRanking(isPublic) {
        const res = this.state.lastExamResult;
        if (!res) return;

        const rawNick = (document.getElementById("ranking-nickname")?.value || "").trim();
        const nickname = rawNick || "匿名考生";
        if (window.CloudSync) window.CloudSync.setNickname(nickname);

        const box = document.getElementById("ranking-submit-box");
        if (!isPublic) {
          if (box) box.innerHTML = `<div class="text-center text-xs font-semibold text-slate-500 py-2">已留存於本機個人成績紀錄</div>`;
          this.showToast("已儲存至本機紀錄", "success");
          return;
        }

        if (box) box.innerHTML = `<div class="text-center text-xs text-slate-400 py-2">正在上傳成績至雲端排行榜...</div>`;

        let cloudRes = { ok: false, reason: "offline" };
        if (window.CloudSync) {
          cloudRes = await window.CloudSync.submitExamRanking(res, nickname);
        }

        if (cloudRes.ok) {
          if (box) box.innerHTML = `<div class="text-center text-xs font-bold text-emerald-600 py-2">🎉 已以「${nickname}」正式登錄至雲端即時排行榜！</div>`;
          this.showToast("成績已登錄雲端排行榜！", "success");
        } else if (cloudRes.reason === "already_submitted") {
          if (box) box.innerHTML = `<div class="text-center text-xs font-semibold text-amber-600 py-2">您已完成過本回次正式登榜（僅採計首次成績），本次練習結果僅留存本機</div>`;

          this.showToast("作答時間異常，未登錄公開榜單", "error");
        } else {
          const existing = JSON.parse(localStorage.getItem(ProgressStore.LOCAL_RANK_KEY) || "[]");
          existing.push({
            id: "rk_" + Date.now(),
            subject: res.subject,
            examType: res.examType,
            examSetId: res.examSetId,
            examTitle: res.examTitle,
            nickname,
            score: res.score,
            elapsedSeconds: res.elapsedSeconds,
            isPublic: true,
            createdAt: new Date().toISOString()
          });
          localStorage.setItem(ProgressStore.LOCAL_RANK_KEY, JSON.stringify(existing));
          if (box) box.innerHTML = `<div class="text-center text-xs font-bold text-emerald-600 py-2">已以「${nickname}」儲存至本機排行榜（離線模式）</div>`;
          this.showToast("已儲存至本機排行榜", "info");
        }
      },

            `}

            <div id="ranking-table-wrapper" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden">
              <div class="p-10 text-center text-xs text-slate-400">正在載入即時排行榜資料...</div>
            </div>

            <div id="my-ranking-footer" class="bg-slate-900 text-white rounded-2xl px-4 py-3 text-xs flex items-center justify-between">
              <span>📍 正在計算我的目前成績...</span>
            </div>
          </div>
        `;
        lucide.createIcons();

        let rows = [];
        if (window.CloudSync && window.CloudSync.ready && navigator.onLine) {
          rows = category === "cumulative"
            ? await window.CloudSync.fetchCumulativeRanking(subTab)
            : await window.CloudSync.fetchExamRanking(subTab);
        } else if (category === "exams") {
          rows = JSON.parse(localStorage.getItem(ProgressStore.LOCAL_RANK_KEY) || "[]")
            .filter((r) => r.subject === subject && r.isPublic && r.examSetId === subTab)
            .sort((a, b) => b.score - a.score || a.elapsedSeconds - b.elapsedSeconds);
        }

        const wrapper = document.getElementById("ranking-table-wrapper");
        const footer = document.getElementById("my-ranking-footer");
        if (!wrapper) return;

        if (rows.length === 0) {
          wrapper.innerHTML = `<div class="p-10 text-center text-xs text-slate-500">目前尚無符合條件的公開上榜紀錄，快來搶下第一名吧！</div>`;
        } else if (category === "cumulative") {
          wrapper.innerHTML = `
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-50 dark:bg-slate-800/70 border-b border-slate-200 dark:border-slate-800 text-slate-500">
                <tr>
                  <th class="py-3 px-4">名次</th>
                  <th class="py-3 px-4">考生暱稱</th>
                  <th class="py-3 px-4">累積題數</th>
                  <th class="py-3 px-4">綜合答對率</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                ${rows.map((item, idx) => {
                  const isMe = item.id === myActorId;
                  return `
                    <tr class="${isMe ? "bg-blue-50/70 dark:bg-blue-950/40" : ""}">
                      <td class="py-3 px-4 font-bold ${idx < 3 ? "text-amber-500" : "text-slate-400"}">#${idx + 1}</td>
                      <td class="py-3 px-4 font-semibold">${item.nickname} ${isMe ? `<span class="ml-1 text-[10px] px-1.5 py-0.5 rounded bg-blue-600 text-white">我</span>` : ""}</td>
                      <td class="py-3 px-4 font-bold text-blue-600 dark:text-blue-400">${item.totalSolved} 題</td>
                      <td class="py-3 px-4 font-mono text-slate-600 dark:text-slate-300">${item.accuracy}%</td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          `;
        } else {
          wrapper.innerHTML = `
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-50 dark:bg-slate-800/70 border-b border-slate-200 dark:border-slate-800 text-slate-500">
                <tr>
                  <th class="py-3 px-4">名次</th>
                  <th class="py-3 px-4">考生暱稱</th>
                  <th class="py-3 px-4">分數</th>
                  <th class="py-3 px-4">作答耗時</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                ${rows.map((item, idx) => {
                  const isMe = item.actorId === myActorId;
                  return `
                    <tr class="${isMe ? "bg-indigo-50/70 dark:bg-indigo-950/40" : ""}">
                      <td class="py-3 px-4 font-bold ${idx < 3 ? "text-amber-500" : "text-slate-400"}">#${idx + 1}</td>
                      <td class="py-3 px-4 font-semibold">${item.nickname} ${isMe ? `<span class="ml-1 text-[10px] px-1.5 py-0.5 rounded bg-indigo-600 text-white">我</span>` : ""}</td>
                      <td class="py-3 px-4 font-bold text-indigo-600 dark:text-indigo-400">${item.score} 分</td>
                      <td class="py-3 px-4 font-mono text-slate-500">${this.formatSeconds(item.elapsedSeconds)}</td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          `;
        }

        if (footer && window.CloudSync) {
          const localRecs = JSON.parse(localStorage.getItem(ProgressStore.STORAGE_KEY) || "{}");
          const myStats = window.CloudSync.computeStats(localRecs);
          const myIdx = rows.findIndex((r) => (category === "cumulative" ? r.id === myActorId : r.actorId === myActorId));
          const rankText = myIdx >= 0 ? `第 ${myIdx + 1} 名` : "尚未進榜";
          footer.innerHTML = `
            <span>📍 我的目前成績：<strong>${rankText}</strong> ｜ 累積 <strong>${myStats.totalSolved}</strong> 題 ｜ 答對率 <strong>${myStats.accuracy}%</strong></span>
            <span class="font-mono text-slate-400">${window.CloudSync.getNickname()}</span>
          `;
        }
      },

      openSyncModal() {
        const currentCode = window.CloudSync ? window.CloudSync.getSyncCode() : (localStorage.getItem("qbank_sync_code") || "");
        const currentNick = window.CloudSync ? window.CloudSync.getNickname() : "匿名考生";
        const lastSyncAt = window.CloudSync ? window.CloudSync.getLastSyncAt() : 0;
        const lastSyncText = lastSyncAt > 0 ? new Date(lastSyncAt).toLocaleString("zh-TW") : "尚未執行雲端同步";
        this._generatedRandomCode = null;

        this.openModal(`
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="text-lg font-bold flex items-center gap-2">
                <i data-lucide="refresh-cw" class="w-5 h-5 text-blue-600"></i> 跨裝置進度同步（6 碼金鑰）
              </h3>
              <button onclick="App.closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <!-- 현재 동기화 상태 배지 -->
            <div class="px-3.5 py-2 rounded-xl text-xs font-bold flex items-center justify-between ${currentCode ? "bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800" : "bg-amber-50 dark:bg-amber-950/50 text-amber-700 dark:text-amber-300 border border-amber-200 dark:border-amber-800"}">
              <span>${currentCode ? `☁️ 雲端同步中：${currentCode}` : "⚠️ 未開啟雲端備份（目前僅存於本機瀏覽器）"}</span>
            </div>

            <!-- 3줄 핵심 안내 카드 -->
            <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-xs text-slate-600 dark:text-slate-300 space-y-1.5 leading-relaxed">
              <div>🔑 <strong>自動雲端備份：</strong>點擊「產生全新代碼」取得 6 碼金鑰並綁定後，做題與錯題紀錄才會永久保存至雲端。</div>
              <div>📱 <strong>跨裝置接續學習：</strong>在手機、平板或電腦輸入同一組 6 碼代碼，即可自動合併所有學習進度（最多 3 台裝置）。</div>
              <div class="text-rose-600 dark:text-rose-400 font-semibold">⚠️ <strong>重要提醒：</strong>本系統免註冊帳號，若遺失 6 碼代碼將無法找回雲端紀錄，請務必複製保存！</div>
            </div>

            <div class="space-y-2">
              <label class="text-xs font-bold block">考生顯示暱稱（排行榜用）：</label>
              <input id="sync-nickname-input" type="text" maxlength="16" value="${currentNick === "匿名考生" ? "" : currentNick}" placeholder="留空則顯示為「匿名考生」" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs" />
            </div>

            <div class="space-y-2">
              <label class="text-xs font-bold block">6 碼跨裝置同步代碼（新用戶請按右側隨機產生，舊用戶可直接輸入）：</label>
              <div class="flex gap-2">
                <input id="sync-code-input" type="text" maxlength="6" value="${currentCode}" placeholder="輸入已有代碼或按右側產生" class="flex-1 px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-mono text-center text-base font-bold uppercase tracking-widest" />
                <button onclick="App.copySyncCode()" class="px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-xs font-bold shrink-0" title="複製代碼">複製代碼</button>
                ${currentCode ? "" : `<button onclick="App.generateSyncCode()" class="px-3 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shrink-0">產生全新代碼</button>`}
              </div>
            </div>

            <div class="text-[11px] text-slate-400 flex items-center justify-between pt-1">
              <span>上次同步時間：${lastSyncText}</span>
              ${currentCode ? `<button onclick="App.triggerManualSync()" class="text-blue-600 dark:text-blue-400 font-bold hover:underline">立即同步</button>` : ""}
            </div>

            <div class="flex justify-end gap-2 pt-2">
              <button onclick="App.closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800">關閉</button>
              <button id="btn-bind-sync" onclick="App.saveSyncCode()" class="px-5 py-2 rounded-xl text-xs font-bold bg-blue-600 hover:bg-blue-500 text-white">綁定並合併進度</button>
            </div>
          </div>
        `);
      },

      generateSyncCode() {
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        let code = "";
        for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
        this._generatedRandomCode = code;
        const input = document.getElementById("sync-code-input");
        if (input) input.value = code;
        this.showToast(`已產生全新隨機代碼：${code}（請點擊下方「綁定並合併進度」啟用備份）`, "info");
      },

      async copySyncCode() {
        const val = (document.getElementById("sync-code-input")?.value || "").trim().toUpperCase();
        if (!val) return;
        try {
          await navigator.clipboard.writeText(val);
          this.showToast(`已複製同步代碼：${val}`, "success");
        } catch {}
      },

      async triggerManualSync() {
        if (!window.CloudSync) return;
        this.showToast("正在與雲端雙向合併進度...", "info");
        const ok = await window.CloudSync.syncNow(true);
        if (ok) {
          this.showToast("雲端雙向同步完成！", "success");
          if (this.state.view === "dashboard") this.renderDashboard();
        } else {
          this.showToast("目前為離線或尚未設定雲端金鑰", "warning");
        }
      },

      async saveSyncCode() {
        const code = (document.getElementById("sync-code-input")?.value || "").trim().toUpperCase();
        const nick = (document.getElementById("sync-nickname-input")?.value || "").trim();
        if (!/^[A-Z2-9]{6}$/.test(code)) {
          this.showToast("請輸入有效的 6 碼同步代碼（不含 0, O, 1, I）", "warning");
          return;
        }

        const isRandomCreated = Boolean(this._generatedRandomCode && this._generatedRandomCode === code);
        const btn = document.getElementById("btn-bind-sync");
        if (btn) { btn.disabled = true; btn.textContent = "合併中..."; }

        try {
          if (window.CloudSync) {
            const res = await window.CloudSync.bindAndSync(code, nick, isRandomCreated);
            this._generatedRandomCode = null;
            this.closeModal();
            if (res.status === "local_only") {
              this.showToast(`已於本機儲存代碼 ${code}（待連線後將自動同步）`, "info");
            } else {
              this.showToast(`雲端雙向合併完成！已同步 ${res.mergedCount} 題紀錄`, "success");
              if (this.state.view === "dashboard") this.renderDashboard();
            }
          } else {
            localStorage.setItem("qbank_sync_code", code);
            this.closeModal();
            this.showToast(`已綁定同步代碼 ${code}`, "success");
          }
        } catch (err) {
          if (btn) { btn.disabled = false; btn.textContent = "綁定並合併進度"; }
          this.showToast(err.message || "綁定失敗，請稍後再試", "error");
        }
      },

      openIssueReportModal(questionId, chapterTitle) {
        const subjectLabel = this.state.subject === "biology" ? "生物" : "化學";
        this.openModal(`
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="text-lg font-bold text-rose-600 flex items-center gap-2">
                <i data-lucide="flag" class="w-5 h-5"></i> 問題回報
              </h3>
              <button onclick="App.closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800 text-xs space-y-1">
              <div><strong>科目章節：</strong>${subjectLabel} · ${chapterTitle}</div>
              <div><strong>題目編號：</strong><span class="font-mono">${questionId}</span></div>
            </div>
            <div class="space-y-1.5">
              <label class="text-xs font-bold">錯誤類型：</label>
              <select id="report-type" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs">
                <option value="錯別字 / 化學式排版異常">錯別字 / 化學式排版異常</option>
                <option value="正確答案標示有誤">正確答案標示有誤</option>
                <option value="選項內容缺漏或重複">選項內容缺漏或重複</option>
                <option value="附圖遺失或不清楚">附圖遺失或不清楚</option>
              </select>
            </div>
            <div class="space-y-1.5">
              <label class="text-xs font-bold">補充說明（選填）：</label>
              <textarea id="report-memo" rows="3" placeholder="請簡述錯誤處，管理員點擊後台回報清單即可直接修正此題..." class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs"></textarea>
            </div>
            <div class="flex justify-end gap-2">
              <button onclick="App.closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800">取消</button>
              <button onclick="App.submitIssueReport('${questionId}', '${chapterTitle}')" class="px-5 py-2 rounded-xl text-xs font-bold bg-rose-600 text-white">送出回報</button>
            </div>
          </div>
        `);
      },

      async submitIssueReport(questionId, chapterTitle) {
        const type = document.getElementById("report-type")?.value || "其他";
        const memo = (document.getElementById("report-memo")?.value || "").trim();
        const q = this.state.dataset?.questions?.find((item) => item.id === questionId);

        const reports = JSON.parse(localStorage.getItem(ProgressStore.REPORTS_KEY) || "[]");
        reports.unshift({
          id: "rep_" + Date.now(),
          subject: this.state.subject,
          chapterId: q?.chapterId || "",
          chapterTitle,
          questionId,
          type,
          memo,
          status: "open",
          createdAt: new Date().toISOString()
        });
        localStorage.setItem(ProgressStore.REPORTS_KEY, JSON.stringify(reports));

        let sentCloud = false;
        if (window.CloudSync) {
          sentCloud = await window.CloudSync.submitIssueReport({
            subject: this.state.subject,
            chapterId: q?.chapterId || "",
            chapterTitle,
            questionId,
            type,
            memo
          });
        }

        this.closeModal();
        this.showToast(
          sentCloud ? "感謝回報！已即時傳送至管理員雲端後台" : "已儲存回報，將於恢復連線後自動傳送至後台",
          "success"
        );
      },

      openFeedbackModal() {
        this.openModal(`
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="text-lg font-bold flex items-center gap-2">
                <i data-lucide="message-square-plus" class="w-5 h-5 text-blue-600"></i> 給製作者的意見回饋
              </h3>
              <button onclick="App.closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <p class="text-xs text-slate-500 dark:text-slate-400">有任何想許願的功能、介面建議，或是覺得哪裡的中文翻譯怪怪的，都歡迎直接留言跟我說！</p>
            <textarea id="feedback-content" rows="4" placeholder="請輸入您的建議或意見..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs"></textarea>
            <div class="flex justify-end gap-2">
              <button onclick="App.closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800">取消</button>
              <button onclick="App.submitFeedback()" class="px-5 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white">送出意見</button>
            </div>
          </div>
        `);
      },

      async submitFeedback() {
        const content = (document.getElementById("feedback-content")?.value || "").trim();
        if (!content) {
          this.showToast("請輸入意見內容", "warning");
          return;
        }
        const list = JSON.parse(localStorage.getItem(ProgressStore.FEEDBACK_KEY) || "[]");
        list.unshift({ id: "fb_" + Date.now(), content, createdAt: new Date().toISOString() });
        localStorage.setItem(ProgressStore.FEEDBACK_KEY, JSON.stringify(list));

        let sentCloud = false;
        if (window.CloudSync) {
          sentCloud = await window.CloudSync.submitFeedback(content, "功能建議");
        }

        this.closeModal();
        this.showToast(
          sentCloud ? "意見已成功傳送至雲端意見箱，感謝您的回饋！" : "意見已暫存，將於連線後自動送出",
          "success"
        );
      },

      /**
       * 관리자 스튜디오 진입점 (admin-editor.js 모듈 위임)
       */
      renderAdminView() {
        this.state.view = "admin";
        if (window.AdminStudio) {
          window.AdminStudio.mount(document.getElementById("app-root"));
        } else {
          this.showToast("管理員模組 (admin-editor.js) 載入失敗", "error");
        }
      },
      renderCustomEditorView() {
        this.state.view = "customEditor";
        if (window.CustomStudio) {
          window.CustomStudio.mount(document.getElementById("app-root"));
        } else {
          this.showToast("自訂編輯器模組載入失敗，請確認 admin-editor.js 是否已更新", "error");
        }
      },

      bindGlobalShortcuts() {
        document.addEventListener("keydown", (e) => {
          if (this.state.view !== "player") return;
          if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) return;

          const key = e.key.toLowerCase();
          if (key === "arrowleft") {
            e.preventDefault();
            this.prevQuestion();
          } else if (key === "arrowright") {
            e.preventDefault();
            this.nextQuestion();
          } else if (key === " ") {
            if (this.state.playerMode === "study" && !this.state.showStudyAnswer) {
              e.preventDefault();
              this.revealStudyAnswer();
            }
          } else if (key === "b") {
            e.preventDefault();
            const q = this.state.playlist[this.state.currentIndex];
            if (q) this.handleToggleBookmark(q.id);
          } else if (["1", "2", "3", "4", "5"].includes(key)) {
            const idx = parseInt(key, 10) - 1;
            const q = this.state.playlist[this.state.currentIndex];
            if (q && idx < q.options.length) {
              this.handleOptionClick(idx);
            }
          }
        });
      },

      openModal(innerHtml) {
        const backdrop = document.getElementById("modal-backdrop");
        const box = document.getElementById("modal-box");
        box.innerHTML = innerHtml;
        backdrop.classList.remove("hidden");
        backdrop.classList.add("flex");
        lucide.createIcons();
      },

      closeModal() {
        const backdrop = document.getElementById("modal-backdrop");
        backdrop.classList.add("hidden");
        backdrop.classList.remove("flex");
      }
    };

    window.App = App;
    window.addEventListener("DOMContentLoaded", () => App.init());
  </script>
  
<!-- 개발자 문의 및 인스타그램 안내 푸터 -->

    <p>
      Instagram：
      <a href="https://instagram.com/wjswldyd_" target="_blank" rel="noopener noreferrer" class="font-bold text-indigo-500 dark:text-indigo-400 hover:underline">
        @wjswldyd_
      </a>
    </p>
  </footer>

  <script type="module" src="cloud-sync.js"></script>
