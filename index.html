<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대용량 AI 문제은행 Master Pro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }

<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans transition-colors duration-200">

        <!-- Main Area -->
        <main class="flex-1 flex overflow-hidden relative">

            <!-- 1. Import & Dashboard Section -->
            <section id="importSection" class="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar max-w-6xl mx-auto w-full space-y-6">
                
                <!-- 파일 등록 상자 -->

                    <div class="flex justify-between items-center">

                    </div>

                    <div class="flex border-b border-slate-200 dark:border-slate-700 text-sm font-medium">
                        <button id="tabPdf" class="flex-1 py-2 text-center border-b-2 border-brand-600 text-brand-600 font-semibold">

                    <div id="pdfTabContent" class="space-y-3">

                            <p class="text-xs text-slate-400 mt-1" id="fileStatusText">1,200페이지 등 대용량 파일은 파싱에 몇 초가 소요될 수 있습니다</p>
                            <input type="file" id="fileInput" accept=".pdf,.txt" class="hidden">
                        </div>
                    </div>

                    <div id="textTabContent" class="space-y-3 hidden">
                        <textarea id="rawTextInput" rows="6" placeholder="추출된 텍스트가 여기에 표시되며 직접 붙여넣을 수도 있습니다..." class="w-full p-3 text-sm rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-brand-500 outline-none custom-scrollbar font-mono text-xs"></textarea>

                    <button id="startParseBtn" onclick="parseAndSaveExam()" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl shadow transition flex justify-center items-center space-x-2 text-sm">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        <span>자동 단원 분할 및 스마트 단원 보정 실행</span>
                    </button>
                </div>

                <!-- 단원 대시보드 -->
                <div class="space-y-4">
                    <div class="flex flex-wrap items-center justify-between gap-3">
                        <h3 class="text-lg font-bold text-slate-900 dark:text-white flex items-center space-x-2">
                            <i class="fa-solid fa-layer-group text-brand-600"></i>
                            <span>학습 단원 목록</span>
                            <span id="chapCountBadge" class="text-xs bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded-full">0개 단원</span>
                        </h3>

                        <div class="relative w-full sm:w-64">

                            <input type="text" id="searchInput" oninput="renderDashboardCards()" placeholder="단원/제목 검색 (예: 56, Conservation...)" class="w-full pl-8 pr-3 py-1.5 text-xs rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-brand-500 outline-none">
                        </div>
                    </div>

                    <div id="dashboardGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    </div>
                </div>

            </section>

            <!-- 2. Quiz View -->
            <section id="quizSection" class="hidden flex-1 flex flex-col md:flex-row overflow-hidden w-full">
                
                <div class="flex-1 flex flex-col overflow-y-auto custom-scrollbar p-4 md:p-6 space-y-4">
                    
                    <div class="bg-white dark:bg-slate-800 rounded-xl p-4 shadow-sm border border-slate-200 dark:border-slate-700 flex flex-wrap items-center justify-between gap-2 shrink-0">
                        <div class="flex items-center space-x-3">
                            <span id="examTitleBadge" class="text-xs font-bold px-3 py-1.5 bg-brand-100 text-brand-700 dark:bg-brand-900/60 dark:text-brand-300 rounded-lg flex items-center space-x-1">
                                <i class="fa-solid fa-book-open"></i>
                                <span id="examTitleBadgeText"></span>
                            </span>
                            <span class="text-xs font-semibold text-slate-500" id="qProgressText"></span>
                        </div>

                        <div class="w-full sm:w-48 bg-slate-200 dark:bg-slate-700 h-2.5 rounded-full overflow-hidden">
                            <div id="progressBar" class="bg-brand-600 h-full w-0 transition-all duration-300"></div>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-md border border-slate-200 dark:border-slate-700 p-5 md:p-8 flex-1 flex flex-col justify-between space-y-6">
                        <div class="space-y-4">
                            <h3 id="questionText" class="text-lg md:text-xl font-bold leading-relaxed text-slate-900 dark:text-white"></h3>
                            <div id="choicesContainer" class="space-y-3 pt-2"></div>
                        </div>

                        <div class="border-t border-slate-100 dark:border-slate-700/60 pt-5 space-y-4">
                            <div class="flex flex-wrap items-center justify-between gap-3">
                                <button onclick="copyQuestionForAI()" class="w-full sm:w-auto px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-xl shadow-md transition flex items-center justify-center space-x-2">
                                    <i class="fa-regular fa-copy"></i>
                                    <span>📋 AI 질문용 문제 복사</span>
                                </button>
                                
                                <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
                                    <button onclick="prevQuestion()" class="px-4 py-2.5 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-sm font-semibold rounded-xl">◀ 이전</button>
                                    <button onclick="nextQuestion()" class="px-5 py-2.5 bg-brand-600 text-white text-sm font-bold rounded-xl shadow">다음 ▶</button>
                                </div>
                            </div>

                            <div id="copyAlertBox" class="hidden bg-emerald-50 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-800 rounded-xl p-3 text-xs font-semibold text-center">
                                ✓ 클립보드에 문제와 정답 정보가 복사되었습니다! 챗봇 창에 붙여넣어 해설을 물어보세요.
                            </div>
                        </div>
                    </div>

                </div>

                <aside class="w-full md:w-72 bg-white dark:bg-slate-800 border-t md:border-t-0 md:border-l border-slate-200 dark:border-slate-700 flex flex-col shrink-0 h-48 md:h-auto">
                    <div class="p-3 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 font-bold text-xs uppercase tracking-wider text-slate-500">
                        OMR 답안지 (클릭 시 이동)
                    </div>
                    <div id="omrGrid" class="flex-1 p-3 grid grid-cols-5 md:grid-cols-4 gap-2 overflow-y-auto custom-scrollbar align-content-start"></div>
                </aside>

            </section>

        </main>
    </div>

    <script>
        let examStore = {}; 
        let currentExamTitle = "";
        let currentIndex = 0;
        let autoNextTimer = null;

        window.onload = function() {
            const savedData = localStorage.getItem("quiz_exam_store");
            if(savedData) {
                examStore = JSON.parse(savedData);
            }
            renderDashboardCards();
            setupDropZone();
        };

        function showDashboard() {
            document.getElementById("quizSection").classList.add("hidden");
            document.getElementById("importSection").classList.remove("hidden");
            document.getElementById("resetExamBtn").classList.add("hidden");
            renderDashboardCards();
        }

        document.getElementById("tabPdf").onclick = () => {
            document.getElementById("pdfTabContent").classList.remove("hidden");
            document.getElementById("textTabContent").classList.add("hidden");
            document.getElementById("tabPdf").className = "flex-1 py-2 text-center border-b-2 border-brand-600 text-brand-600 font-semibold";
            document.getElementById("tabText").className = "flex-1 py-2 text-center border-b-2 border-transparent text-slate-500 hover:text-slate-700 dark:hover:text-slate-300";
        };
        document.getElementById("tabText").onclick = () => {
            document.getElementById("textTabContent").classList.remove("hidden");
            document.getElementById("pdfTabContent").classList.add("hidden");
            document.getElementById("tabText").className = "flex-1 py-2 text-center border-b-2 border-brand-600 text-brand-600 font-semibold";
            document.getElementById("tabPdf").className = "flex-1 py-2 text-center border-b-2 border-transparent text-slate-500 hover:text-slate-700 dark:hover:text-slate-300";
        };

        function setupDropZone() {
            const dropZone = document.getElementById("dropZone");
            const fileInput = document.getElementById("fileInput");

            dropZone.onclick = () => fileInput.click();

            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                }, false);
            });

            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => {
                    dropZone.classList.add('border-brand-500', 'bg-brand-50/50');
                }, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => {
                    dropZone.classList.remove('border-brand-500', 'bg-brand-50/50');
                }, false);
            });

            dropZone.addEventListener('drop', (e) => {
                const dt = e.dataTransfer;
                const files = dt.files;
                if(files.length > 0) {
                    fileInput.files = files;
                    handleFileSelect(files[0]);
                }
            }, false);

            fileInput.onchange = (e) => {
                if(e.target.files.length > 0) {
                    handleFileSelect(e.target.files[0]);
                }
            };
        }

        // 단어 단위 스마트 사전 재조합 보정 엔진 (whic hof -> which of, excessivele vels -> excessive levels)
        function cleanPdfTextSpacings(str) {
            if(!str) return "";
            
            // 1. 고유 어휘 & 과학용어 정밀 수정
            let text = str
                .replace(/\bDN\s+A\b/gi, "DNA")
                .replace(/\bRN\s+A\b/gi, "RNA")
                .replace(/\bP\s+CR\b/gi, "PCR")
                .replace(/\bmR\s+NA\b/gi, "mRNA")
                .replace(/\bcD\s+NA\b/gi, "cDNA");

            // 2. 자주 파쇄되는 특정 단어 조합 딕셔너리 일괄 치환
            const splitDict = {
                "whic hof": "which of",
                "patient'scancer": "patient's cancer",
                "excessivele vels": "excessive levels",
                "excessivele": "excessive",
                "wit hout": "without",
                "v arious": "various",
                "cel l": "cell",
                "cel ls": "cells",
                "pro tein": "protein",
                "pro teins": "proteins",
                "gen e": "gene",
                "gen es": "genes",
                "m olecule": "molecule",
                "organ ism": "organism"
            };

            for (let [broken, fixed] of Object.entries(splitDict)) {
                const reg = new RegExp(broken.replace(/([.*+?^${}()|[\]\\])/g, '\\$1'), 'gi');
                text = text.replace(reg, fixed);
            }

            // 3. 문장 내부 부서진 철자 통합 (부정관사 'a' 보호 조건)
            return text
                .replace(/\b([b-zB-Z])\s+([a-z]{2,})\b/g, "$1$2")
                .replace(/\b([a-zA-Z]{2,})\s+([a-z]{1,2})\b/g, (match, p1, p2) => {
                    const validShortWords = ['in', 'on', 'at', 'to', 'of', 'or', 'is', 'it', 'by', 'as', 'an', 'be', 'no', 'so', 'do', 'if', 'we', 'he', 'me', 'my', 'us', 'up', 'am'];
                    if (validShortWords.includes(p2.toLowerCase())) return match;
                    return p1 + p2;
                });
        }

        function handleFileSelect(file) {
            document.getElementById("fileStatusText").textContent = `선택된 파일: ${file.name} (텍스트 추출 및 스마트 보정 분석 중...)`;
            const reader = new FileReader();
            reader.onload = async function() {
                try {
                    const typedarray = new Uint8Array(this.result);
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    let fullText = "";
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        
                        let lastY = null;
                        let pageText = "";
                        for (let item of textContent.items) {
                            if (lastY !== null && Math.abs(item.transform[5] - lastY) > 5) {
                                pageText += "\n";
                            }
                            pageText += item.str + " ";
                            lastY = item.transform[5];
                        }
                        fullText += pageText + "\n";
                    }
                    
                    fullText = cleanPdfTextSpacings(fullText);

                    document.getElementById("rawTextInput").value = fullText;
                    document.getElementById("fileStatusText").textContent = `텍스트 추출 완료! (총 ${pdf.numPages}페이지)`;
                    parseAndSaveExam();
                } catch(err) {
                    alert("PDF를 읽는 중 오류가 발생했습니다: " + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function parseAndSaveExam() {
            let text = document.getElementById("rawTextInput").value;
            if(!text.trim()) return alert("텍스트를 붙여넣거나 PDF 파일을 업로드해주세요.");

            text = cleanPdfTextSpacings(text);

            const lines = text.split('\n');
            let currentChap = "기본 단원";
            let currentQ = null;
            let addedCount = 0;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if(!line) continue;

                // 1. 단원 헤더 탐지
                const chapMatch = line.match(/(?:Chapter|Concept|Ch\.)\s*(\d+)[:\s]*(.*)/i);
                if (chapMatch) {
                    const chapNum = chapMatch[1];
                    let rawTitle = chapMatch[2] ? chapMatch[2].trim() : "";

                    if (!rawTitle || rawTitle.length < 3) {
                        let lookAheadTitles = [];
                        for (let j = 1; j <= 2; j++) {
                            if (i + j < lines.length) {
                                const nextL = lines[i + j].trim();
                                if (!nextL || nextL.match(/^(?:Q|Question)?\s*\d+[.):]/i) || nextL.match(/^(?:Chapter|Concept|Ch\.)/i)) {
                                    break;
                                }
                                lookAheadTitles.push(nextL);
                            }
                        }
                        rawTitle = lookAheadTitles.join(" ");
                    }

                    rawTitle = cleanPdfTextSpacings(rawTitle).replace(/^[^a-zA-Z가-힣]+/, '').trim();
                    if (rawTitle.length > 50) {
                        rawTitle = rawTitle.substring(0, 50) + "...";
                    }

                    const nextChapTitle = rawTitle ? `Chapter ${chapNum}: ${rawTitle}` : `${chapNum}단원`;

                    if (currentQ && currentQ.options.length > 0) {
                        pushQuestionToStore(currentChap, currentQ);
                        currentQ = null;
                    }

                    currentChap = nextChapTitle;
                    if (!examStore[currentChap]) examStore[currentChap] = [];
                    continue;
                }

                // 2. 문제 번호 감지 및 본문 정제
                const qMatch = line.match(/^(?:Q|Question)?\s*(\d+)\s*[.):]\s*(.+)/i);
                if(qMatch) {
                    if(currentQ && currentQ.options.length > 0) {
                        pushQuestionToStore(currentChap, currentQ);
                    }
                    currentQ = { id: parseInt(qMatch[1]), question: cleanPdfTextSpacings(qMatch[2]), options: [], answer: "", userAns: null, isCorrect: null };
                    addedCount++;
                    continue;
                }

                // 3. 보기 감지 및 선지 정제
                const optMatch = line.match(/^[\(\[]?([A-Da-d])[\)\.]\s*(.+)/);
                if(optMatch && currentQ) {
                    currentQ.options.push({ key: optMatch[1].toUpperCase(), text: cleanPdfTextSpacings(optMatch[2]) });
                    continue;
                }

                // 4. 정답 감지
                const ansMatch = line.match(/^(?:Answer|ANS|Correct Answer|정답)\s*[:=]\s*([A-D])/i);
                if(ansMatch && currentQ) {
                    currentQ.answer = ansMatch[1].toUpperCase();
                    continue;
                }

                // 5. 문장 이어붙이기
                if(currentQ) {
                    if(currentQ.options.length > 0 && !currentQ.answer) {
                        currentQ.options[currentQ.options.length - 1].text = cleanPdfTextSpacings(currentQ.options[currentQ.options.length - 1].text + " " + line);
                    } else if(!currentQ.answer) {
                        currentQ.question = cleanPdfTextSpacings(currentQ.question + " " + line);
                    }
                }
            }
            
            if(currentQ && currentQ.options.length > 0) {
                pushQuestionToStore(currentChap, currentQ);
            }

            if(addedCount === 0) {
                document.getElementById("tabText").click();
                return alert("문제를 인식하지 못했습니다.\n'텍스트 확인' 탭에 추출된 문제 형식을 확인해보세요.");
            }

            saveState();
            renderDashboardCards();
            alert(`성공! 총 ${addedCount}개 문제가 인식되어 단원 제목별로 분할 저장되었습니다.`);
        }

        function pushQuestionToStore(chapTitle, q) {
            if(!examStore[chapTitle]) examStore[chapTitle] = [];
            if(!examStore[chapTitle].some(item => item.id === q.id && item.question === q.question)) {
                examStore[chapTitle].push(q);
            }
        }

        function renderDashboardCards() {
            const grid = document.getElementById("dashboardGrid");
            const searchKw = document.getElementById("searchInput") ? document.getElementById("searchInput").value.toLowerCase() : "";
            grid.innerHTML = "";

            const titles = Object.keys(examStore);
            document.getElementById("chapCountBadge").textContent = `${titles.length}개 단원`;

            if(titles.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 text-slate-400 text-sm">등록된 단원이 없습니다. 위 영역에 PDF 파일을 드롭하여 추가해보세요.</div>`;
                return;
            }

            titles.forEach(title => {
                if(searchKw && !title.toLowerCase().includes(searchKw)) return;

                const list = examStore[title];
                const total = list.length;
                const solved = list.filter(q => q.userAns !== null).length;
                const correct = list.filter(q => q.isCorrect === true).length;
                const percent = total > 0 ? Math.round((solved / total) * 100) : 0;

                const card = document.createElement("div");
                card.className = "bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md hover:border-brand-500 transition cursor-pointer flex flex-col justify-between space-y-4";
                card.onclick = () => startQuiz(title);

                card.innerHTML = `
                    <div class="space-y-2">
                        <div class="flex justify-between items-start">
                            <span class="font-bold text-base text-slate-900 dark:text-white line-clamp-2">📚 ${title}</span>
                            <span class="text-xs font-extrabold px-2 py-0.5 rounded-full shrink-0 ml-2 ${percent === 100 ? 'bg-emerald-100 text-emerald-700' : 'bg-brand-50 text-brand-600'}">${percent}% 완료</span>
                        </div>
                        <div class="text-xs text-slate-500 flex justify-between pt-1">
                            <span>총 ${total} 문제</span>
                            <span>정답 ${correct} / 풀이 ${solved}</span>
                        </div>
                    </div>

                    <div class="w-full bg-slate-100 dark:bg-slate-700 h-2 rounded-full overflow-hidden">
                        <div class="bg-brand-600 h-full transition-all duration-300" style="width: ${percent}%"></div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function startQuiz(title) {
            currentExamTitle = title;
            currentIndex = 0;
            document.getElementById("importSection").classList.add("hidden");
            document.getElementById("quizSection").classList.remove("hidden");
            document.getElementById("resetExamBtn").classList.remove("hidden");
            renderQuestion();
        }

        function renderQuestion() {
            if(autoNextTimer) clearTimeout(autoNextTimer);
            const list = examStore[currentExamTitle];
            const q = list[currentIndex];

            document.getElementById("examTitleBadgeText").textContent = currentExamTitle;
            document.getElementById("qProgressText").textContent = `문제 ${currentIndex + 1} / ${list.length}`;
            document.getElementById("progressBar").style.width = `${((currentIndex + 1) / list.length) * 100}%`;
            document.getElementById("questionText").textContent = `${q.id}) ${q.question}`;
            document.getElementById("copyAlertBox").classList.add("hidden");

            const container = document.getElementById("choicesContainer");
            container.innerHTML = "";

            q.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 transition text-sm font-medium flex items-center justify-between";
                
                if(q.userAns !== null) {
                    if(opt.key === q.answer) {
                        btn.className += " bg-emerald-100 border-emerald-500 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 font-bold";
                        btn.innerHTML = `<span><b>${opt.key})</b> ${opt.text}</span> <span class="text-emerald-600 font-bold ml-2">✓ 정답</span>`;
                    } else if(opt.key === q.userAns) {
                        btn.className += " bg-rose-100 border-rose-500 text-rose-800 dark:bg-rose-950 dark:text-rose-300 font-bold";
                        btn.innerHTML = `<span><b>${opt.key})</b> ${opt.text}</span> <span class="text-rose-600 font-bold ml-2">✗ 내가 택한 답</span>`;
                    } else {
                        btn.innerHTML = `<span><b>${opt.key})</b> ${opt.text}</span>`;
                    }
                } else {
                    btn.innerHTML = `<span><b>${opt.key})</b> ${opt.text}</span>`;
                }

                btn.onclick = () => selectAnswer(opt.key);
                container.appendChild(btn);
            });

            renderOMR();
        }

        function selectAnswer(key) {
            const q = examStore[currentExamTitle][currentIndex];
            if(q.userAns !== null) return;

            q.userAns = key;
            q.isCorrect = (key === q.answer);
            saveState();
            renderQuestion();

            if (q.isCorrect) {
                if (currentIndex < examStore[currentExamTitle].length - 1) {
                    autoNextTimer = setTimeout(() => {
                        nextQuestion();
                    }, 600);
                }
            }
        }

        function renderOMR() {
            const grid = document.getElementById("omrGrid");
            grid.innerHTML = "";
            examStore[currentExamTitle].forEach((q, idx) => {
                const btn = document.createElement("button");
                let bg = "bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300";
                if(q.userAns !== null) bg = q.isCorrect ? "bg-emerald-500 text-white font-bold" : "bg-rose-500 text-white font-bold";
                
                btn.className = `h-10 rounded-lg text-xs font-medium flex items-center justify-center transition ${bg} ${idx === currentIndex ? 'ring-2 ring-brand-600' : ''}`;
                btn.textContent = q.id;
                btn.onclick = () => { currentIndex = idx; renderQuestion(); };
                grid.appendChild(btn);
            });
        }

        function nextQuestion() {
            if(currentIndex < examStore[currentExamTitle].length - 1) { currentIndex++; renderQuestion(); }
        }
        function prevQuestion() {
            if(currentIndex > 0) { currentIndex--; renderQuestion(); }
        }

        function copyQuestionForAI() {
            const q = examStore[currentExamTitle][currentIndex];
            const optsText = q.options.map(o => `${o.key}) ${o.text}`).join('\n');
            
            let userAnsText = "선택 안 함";
            if(q.userAns !== null) {
                const matchedOpt = q.options.find(o => o.key === q.userAns);
                userAnsText = `${q.userAns}) ${matchedOpt ? matchedOpt.text : ''}`;
            }

            const copyText = `[단원]: ${currentExamTitle}\n` +
                             `[문제]: ${q.id}) ${q.question}\n\n` +
                             `[보기]:\n${optsText}\n\n` +
                             `[내가 선택한 답]: ${userAnsText}\n` +
                             `[정답]: ${q.answer}\n\n` +
                             `위 문제의 정답 원리와 각 보기가 왜 맞고 틀린지 한국어로 명확하게 설명해줘.`;

            navigator.clipboard.writeText(copyText).then(() => {
                const alertBox = document.getElementById("copyAlertBox");
                alertBox.classList.remove("hidden");
                setTimeout(() => alertBox.classList.add("hidden"), 3000);
            }).catch(err => {
                alert("복사에 실패했습니다: " + err);
            });
        }

        function saveState() {
            localStorage.setItem("quiz_exam_store", JSON.stringify(examStore));
        }

        function resetCurrentExam() {
            if(confirm(`'${currentExamTitle}'의 풀이 기록을 지우시겠습니까?`)) {
                examStore[currentExamTitle].forEach(q => { q.userAns = null; q.isCorrect = null; });
                saveState();
                renderQuestion();
            }
        }

        function resetAllData() {
            if(confirm("모든 단원과 학습 기록을 삭제하시겠습니까?")) {
                localStorage.removeItem("quiz_exam_store");
                examStore = {};
                location.reload();
            }
        }
    </script>
</body>
</html>
